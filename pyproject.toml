[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "duckboard"
version = "0.0.0"
description = "File-first local SQL workspace for CSV, Parquet, and JSON — powered by DuckDB."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Om Uniyal" },
]
keywords = ["duckdb", "sql", "csv", "parquet", "cli", "repl", "analytics"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Utilities",
]
dependencies = [
    "duckdb>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]
readline = ["pyreadline3>=3.0; sys_platform == 'win32'"]

[project.scripts]
duckboard = "duckboard.cli:main"

[project.urls]
Homepage = "https://github.com/OmUniyal/duckboard"
Repository = "https://github.com/OmUniyal/duckboard"
Issues = "https://github.com/OmUniyal/duckboard/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/duckboard"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
